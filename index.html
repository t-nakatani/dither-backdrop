<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>網点バックドロップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: 左に大きな描画面、右に操作の列。狭い画面では描画面の下に操作が並ぶ。 */
:root {
  --bg: #e9ecf1;
  --panel: #f8f9fb;
  --fg: #151820;
  --muted: #5b6372;
  --line: #d5dae3;
  --chip: #eceff4;
  --accent: #2b5cf0;
  --accent-fg: #ffffff;
  --mock-glass: rgba(14, 16, 22, 0.86);
  --mock-card: rgba(18, 20, 27, 0.78);
  --mock-fg: #eef0f4;
  --mock-muted: #9aa1ad;
  --mock-cell: rgba(255, 255, 255, 0.08);
  --mock-hot: rgba(120, 160, 255, 0.55);
  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d11; --panel: #12151b; --fg: #e6e9ef; --muted: #8b93a2; --line: #232833; --chip: #1a1e26; --accent: #7092ff; --accent-fg: #0b0d11;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d11; --panel: #12151b; --fg: #e6e9ef; --muted: #8b93a2; --line: #232833; --chip: #1a1e26; --accent: #7092ff; --accent-fg: #0b0d11;
  color-scheme: dark;
}

[hidden] { display: none !important; }
body { margin: 0; }
img { max-width: 100%; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.55; }
* { box-sizing: border-box; }

.app {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 336px;
  gap: 16px;
  height: 100%;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.stage { position: relative; min-width: 0; min-height: 0; border-radius: 14px; overflow: hidden; background: #05060a; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage.drag::after { content: "画像をここに置く"; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 600; color: #fff; background: rgba(43, 92, 240, 0.45); }
.webgl-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; color: #fff; text-align: center; }

.panel { min-width: 0; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 22px; display: flex; flex-direction: column; gap: 22px; }
.panel header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.01em; }
.panel header p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }

section { display: flex; flex-direction: column; gap: 10px; }
.label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; color: var(--muted); }

.presets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.preset { all: unset; cursor: pointer; display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--chip); }
.preset img { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 6px; background: #05060a; object-fit: cover; }
.preset span { font-size: 12px; padding: 0 2px 2px; }
.preset[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.preset:focus-visible, .seg button:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 3px; background: var(--chip); border-radius: 9px; }
.seg button { all: unset; cursor: pointer; flex: 1 1 auto; text-align: center; padding: 6px 8px; font-size: 12.5px; border-radius: 7px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,0.12); }

.ctl { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; }
.ctl label { font-size: 13px; }
.ctl output { font-family: var(--font-num); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ctl input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 2px 0 0; }

.colors { display: flex; gap: 10px; flex-wrap: wrap; }
.color { display: flex; align-items: center; gap: 8px; padding: 5px 10px 5px 5px; border: 1px solid var(--line); border-radius: 9px; font-size: 13px; }
.color input { width: 30px; height: 26px; border: 0; padding: 0; background: none; cursor: pointer; }

.toggle { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { all: unset; cursor: pointer; padding: 8px 12px; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.btn.grow { flex: 1 1 auto; }
select { font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); flex: 1 1 140px; min-width: 0; }
.note { margin: 0; color: var(--muted); font-size: 12px; }
.toast { min-height: 1.2em; margin: 0; font-size: 12px; color: var(--accent); }

/* 重ねて見るための UI の見本 */
.mock { position: absolute; inset: 0; pointer-events: none; display: flex; align-items: center; justify-content: flex-start; padding: 6% 0 6% 6%; }
.mock-win { width: min(88%, 760px); height: min(100%, 520px); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.08); color: var(--mock-fg); }
.mock-bar { height: 34px; background: var(--mock-glass); display: flex; gap: 7px; align-items: center; padding: 0 12px; }
.mock-bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; }
.mock-bar i:nth-child(2) { background: #febc2e; }
.mock-bar i:nth-child(3) { background: #28c840; }
.mock-body { flex: 1; display: flex; min-height: 0; }
.mock-side { width: 200px; flex: none; background: var(--mock-glass); padding: 14px 14px; display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; }
.mock-side b { font-size: 14px; font-weight: 600; }
.mock-side .new { padding: 7px 9px; border-radius: 8px; background: rgba(255,255,255,0.07); }
.mock-side .sub { color: var(--mock-muted); font-size: 11.5px; margin-top: 4px; }
.mock-main { flex: 1; position: relative; }
.mock-card { position: absolute; right: 7%; bottom: 10%; width: 230px; padding: 14px; border-radius: 12px; background: var(--mock-card); display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(2px); }
.mock-card small { color: var(--mock-muted); font-size: 11.5px; }
.mock-card strong { font-family: var(--font-num); font-size: 24px; font-weight: 500; }
.mock-grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; }
.mock-grid span { aspect-ratio: 1; border-radius: 2px; background: var(--mock-cell); }
.mock-grid span.on { background: var(--mock-hot); }

/* 書き出した画像 */
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(5, 6, 10, 0.72); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.modal-box { background: var(--panel); color: var(--fg); border-radius: 14px; padding: 16px; width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.modal-box img { display: block; max-width: 100%; max-height: 62vh; margin: 0 auto; border-radius: 8px; object-fit: contain; background: #05060a; }
.modal-box h2 { margin: 0; font-size: 15px; font-weight: 600; }

@media (max-width: 820px) {
  html, body { height: auto; }
  .app { grid-template-columns: minmax(0, 1fr); height: auto; }
  .stage { height: 62svh; min-height: 360px; }
  .mock-side { width: 118px; font-size: 11px; padding: 12px 10px; }
  .mock-side b { font-size: 12.5px; }
  .mock-card { width: 148px; right: 5%; padding: 10px; }
  .mock-card strong { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="view" aria-label="生成した背景"></canvas>
    <div class="mock" id="mock" hidden>
      <div class="mock-win">
        <div class="mock-bar"><i></i><i></i><i></i></div>
        <div class="mock-body">
          <aside class="mock-side">
            <b>セッション</b>
            <span class="new">＋ 新しいセッション</span>
            <span class="sub">最近</span>
            <span>見積もりの下書き</span>
            <span>週次の報告をまとめる</span>
            <span>LP のヒーローを直す</span>
            <span>請求書の照合</span>
          </aside>
          <div class="mock-main">
            <div class="mock-card">
              <small>今月の稼働</small>
              <strong>128.5 h</strong>
              <div class="mock-grid" id="mockGrid"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="panel">
    <header>
      <h1>網点バックドロップ</h1>
      <p>写真やグラデーションを、ディザ・網点・モザイクで描き直して背景にします。画像を描画面へドロップしても使えます。</p>
    </header>

    <section>
      <div class="label">見本</div>
      <div class="presets" id="presets"></div>
    </section>

    <section>
      <div class="label">元の絵</div>
      <div class="seg" id="segSource"></div>
      <input type="file" id="file" accept="image/*" hidden>
    </section>

    <section>
      <div class="label">効果</div>
      <div class="seg" id="segEffect"></div>
      <div class="seg" id="segPattern" data-effects="0"></div>
      <div class="seg" id="segShape" data-effects="2"></div>
    </section>

    <section id="sliders"></section>

    <section data-effects="1,2">
      <div class="label">色</div>
      <div class="colors">
        <label class="color"><input type="color" id="ink"><span id="inkLabel">地の色</span></label>
        <label class="color" data-effects="2"><input type="color" id="paper"><span>紙の色</span></label>
      </div>
    </section>

    <section>
      <label class="toggle" for="animate">ゆっくり動かす<input type="checkbox" id="animate"></label>
      <label class="toggle" for="overlay">UI を重ねて見る<input type="checkbox" id="overlay"></label>
    </section>

    <section>
      <div class="label">書き出し</div>
      <div class="row">
        <select id="size" aria-label="書き出す大きさ">
          <option value="view">いまの描画面の大きさ</option>
          <option value="1920x1080">1920 × 1080（横長）</option>
          <option value="2560x1440">2560 × 1440（横長）</option>
          <option value="1080x1350">1080 × 1350（4:5）</option>
          <option value="1170x2532">1170 × 2532（スマホ縦）</option>
        </select>
        <button class="btn primary" id="export">PNG を作る</button>
      </div>
      <div class="row">
        <button class="btn grow" id="copyJson">設定をコピー</button>
        <button class="btn grow" id="copyShader">シェーダーをコピー</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </section>
  </aside>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h2 id="modalTitle">書き出した画像</h2>
    <img id="modalImg" alt="書き出した背景の画像">
    <p class="note" id="modalNote">粒の細かさは、いまの画面と同じ倍率です。</p>
    <div class="row">
      <button class="btn primary grow" id="saveImg" hidden>PNG を保存</button>
      <button class="btn grow" id="copyImg">画像をコピー</button>
      <button class="btn grow" id="closeModal">閉じる</button>
    </div>
    <p class="toast" id="modalToast" role="status"></p>
  </div>
</div>

<script id="frag" type="x-shader/x-fragment">
precision highp float;
uniform vec2 uRes;
uniform float uTime;
uniform int uSource;   // 0 プリズム 1 青の流れ 2 積雲 3 夕方の雲 4 画像
uniform int uEffect;   // 0 ディザ 1 ドット 2 二色刷り 3 モザイク
uniform int uPattern;  // 0 規則 1 ランダム
uniform int uShape;    // 0 丸 1 線 2 ひし形
uniform sampler2D uTex;
uniform vec2 uTexSize;
uniform float uCell;     // 粒の大きさ（実ピクセル）
uniform float uContrast;
uniform float uBright;
uniform float uGap;      // すき間（実ピクセル）
uniform float uLevels;
uniform float uAngle;
uniform float uMix;
uniform vec3 uInk;
uniform vec3 uPaper;

float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = hash(i), b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0)), d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 6; i++) {
    v += a * vnoise(p);
    p = mat2(1.6, 1.2, -1.2, 1.6) * p + 17.0;
    a *= 0.5;
  }
  return v;
}
float luma(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }

// ---- 元の絵 ----
vec3 srcPrism(vec2 q) {
  float t = uTime;
  vec2 dir = normalize(vec2(1.0, 0.62));
  vec2 nrm = vec2(-dir.y, dir.x);
  vec2 c = vec2(0.0, -0.06);
  float along = dot(q - c, dir);
  float n = fbm(q * 1.6 + vec2(t * 0.03, -t * 0.02));
  float d = dot(q - c, nrm) + 0.09 * (n - 0.5) + 0.04 * sin(along * 3.0 + t * 0.2);
  float x = d / 0.13;
  float st = 0.55 + 0.9 * fbm(vec2(along * 1.8 - t * 0.06, d * 16.0));
  float fade = smoothstep(-1.1, 0.4, along);
  vec3 g = vec3(0.0);
  g += vec3(0.10, 0.38, 1.00) * exp(-pow((x + 0.8) / 0.6, 2.0)) * 0.8;
  g += vec3(0.80, 0.82, 0.85) * exp(-pow((x - 0.05) / 0.26, 2.0)) * 0.75;
  g += vec3(1.00, 0.48, 0.12) * exp(-pow((x - 0.45) / 0.24, 2.0)) * 0.95;
  g += vec3(1.00, 0.10, 0.03) * exp(-pow((x - 0.80) / 0.13, 2.0)) * 1.1;
  vec3 bg = vec3(0.025, 0.027, 0.04) + 0.035 * vec3(n);
  return bg + g * st * fade;
}
vec3 srcSweep(vec2 q) {
  float t = uTime;
  float n = fbm(q * 1.3 + vec2(t * 0.025, t * 0.015));
  float g = dot(q, normalize(vec2(1.0, 0.8))) + 0.16 * (n - 0.5) + 0.03 * sin(q.y * 4.0 + t * 0.3);
  vec3 col = vec3(0.86, 0.89, 0.86);
  col = mix(col, vec3(0.62, 0.76, 0.90), smoothstep(-0.55, -0.2, g));
  col = mix(col, vec3(0.14, 0.33, 0.68), smoothstep(-0.2, 0.08, g));
  col = mix(col, vec3(0.04, 0.10, 0.30), smoothstep(0.04, 0.35, g));
  col = mix(col, vec3(0.01, 0.02, 0.06), smoothstep(0.3, 0.8, g));
  float glow = exp(-pow(length((q - vec2(-0.45, 0.35)) * vec2(1.0, 1.8)) / 0.35, 2.0));
  col += vec3(0.05, 0.20, 0.55) * glow * 0.8;
  return col;
}
float cloudField(vec2 q, float yc, float spread) {
  vec2 p = q * vec2(1.5, 1.9) + vec2(uTime * 0.015, 0.0);
  vec2 w = vec2(fbm(p + vec2(1.7, 9.2)), fbm(p + vec2(8.3, 2.8)));
  float f = fbm(p * 1.4 + 1.6 * w);
  float band = 1.0 - smoothstep(0.0, spread, abs(q.y - yc));
  return f + 0.3 * band - 0.2;
}
vec3 clouds(vec2 q, float yc, float spread, vec3 sky, vec3 shadow, vec3 lit, float edge) {
  float fd = cloudField(q, yc, spread);
  float d = smoothstep(0.48, 0.6, fd);
  float du = smoothstep(0.48, 0.6, cloudField(q - vec2(0.0, 0.035), yc, spread));
  float shade = clamp((d - du) * 2.5, -1.0, 1.0);
  vec3 cl = mix(shadow, lit, clamp(0.5 + edge * shade + 1.2 * (fd - 0.6) + 0.9 * (fbm(q * 5.0 + 3.0) - 0.5), 0.0, 1.0));
  return mix(sky, cl, d);
}
vec3 srcCumulus(vec2 q) {
  vec3 sky = mix(vec3(0.13, 0.30, 0.92), vec3(0.20, 0.42, 0.96), smoothstep(-0.6, 0.6, q.y));
  return clouds(q, 0.0, 0.36, sky, vec3(0.62, 0.70, 0.92), vec3(1.0), 1.2);
}
vec3 srcDusk(vec2 q) {
  vec3 sky = mix(vec3(0.35, 0.44, 0.47), vec3(0.60, 0.68, 0.68), smoothstep(-0.7, 0.5, q.y));
  return clouds(q * 1.1 + vec2(0.3, 0.0), 0.3, 0.3, sky, vec3(0.42, 0.50, 0.52), vec3(0.92, 0.85, 0.66), 1.1);
}
vec3 source(vec2 pix) {
  if (uSource == 4) {
    vec2 uv = pix / uRes;
    float ra = uRes.x / uRes.y, ta = uTexSize.x / uTexSize.y;
    vec2 sc = ra > ta ? vec2(1.0, ta / ra) : vec2(ra / ta, 1.0);
    uv = (uv - 0.5) * sc + 0.5;
    return texture2D(uTex, uv).rgb;
  }
  vec2 q = (pix - 0.5 * uRes) / min(uRes.x, uRes.y);
  if (uSource == 0) return srcPrism(q);
  if (uSource == 1) return srcSweep(q);
  if (uSource == 2) return srcCumulus(q);
  return srcDusk(q);
}
vec3 grade(vec3 c) {
  return clamp((c - 0.5) * uContrast + 0.5 + uBright, 0.0, 1.0);
}

// ---- 効果 ----
float bayer2(vec2 a) { a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
float bayer4(vec2 a) { return bayer2(0.5 * a) * 0.25 + bayer2(a); }
float bayer8(vec2 a) { return bayer4(0.5 * a) * 0.25 + bayer2(a); }
float gapMask(vec2 loc) {
  vec2 px = loc * uCell;
  return step(uGap, px.x) * step(uGap, px.y);
}

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec3 outc;
  float aa = 0.8 / uCell;

  if (uEffect == 0) {
    vec2 cell = floor(frag / uCell);
    vec2 loc = fract(frag / uCell);
    vec3 c = grade(source((cell + 0.5) * uCell));
    vec3 b = uPattern == 0 ? vec3(bayer8(cell))
                           : vec3(hash(cell + 0.31), hash(cell + 17.7), hash(cell + 41.3));
    float L = max(uLevels - 1.0, 1.0);
    c = clamp(floor(c * L + b) / L, 0.0, 1.0);
    outc = c * gapMask(loc);
  } else if (uEffect == 1) {
    vec2 cell = floor(frag / uCell);
    vec2 loc = fract(frag / uCell) - 0.5;
    vec3 c = grade(source((cell + 0.5) * uCell));
    float l = luma(c);
    float r = sqrt(l) * 0.62;
    float m = 1.0 - smoothstep(r - aa, r + aa, length(loc));
    vec3 dotc = clamp(mix(c, c / max(sqrt(l), 0.15), 0.45), 0.0, 1.0);
    outc = mix(uInk, dotc, m);
  } else if (uEffect == 2) {
    float a = radians(uAngle);
    float ca = cos(a), sa = sin(a);
    vec2 rp = vec2(ca * frag.x + sa * frag.y, -sa * frag.x + ca * frag.y);
    vec2 cell = floor(rp / uCell);
    vec2 loc = fract(rp / uCell) - 0.5;
    vec2 cc = (cell + 0.5) * uCell;
    vec2 center = vec2(ca * cc.x - sa * cc.y, sa * cc.x + ca * cc.y);
    float l = luma(grade(source(center)));
    float dist, r;
    if (uShape == 0) { dist = length(loc); r = sqrt(l) * 0.6; }
    else if (uShape == 1) { dist = abs(loc.y); r = l * 0.5; }
    else { dist = (abs(loc.x) + abs(loc.y)) * 0.7071; r = sqrt(l) * 0.5; }
    float m = 1.0 - smoothstep(r - aa, r + aa, dist);
    outc = mix(uInk, uPaper, m);
  } else {
    vec2 cell = floor(frag / uCell);
    vec2 loc = fract(frag / uCell);
    vec3 c = grade(source((cell + 0.5) * uCell));
    float P = max(uLevels - 1.0, 1.0);
    float l = luma(c);
    float ql = floor(l * P + 0.5) / P;
    vec3 pc = clamp(c * (ql / max(l, 0.001)), 0.0, 1.0);
    float lev = floor(clamp(l, 0.0, 0.999) * 5.0);
    vec2 s = (floor(loc * 5.0) + 0.5) / 5.0 - 0.5;
    float cheb = max(abs(s.x), abs(s.y));
    float g = 0.0;
    if (lev > 3.5) g = step(cheb, 0.45) * (1.0 - step(0.35, abs(s.x)) * step(0.35, abs(s.y)));
    else if (lev > 2.5) g = step(cheb, 0.25);
    else if (lev > 1.5) g = step(abs(cheb - 0.2), 0.05);
    else if (lev > 0.5) g = step(cheb, 0.05);
    vec3 bg = pc * 0.86;
    vec3 fg = clamp(mix(pc, vec3(1.0), 0.14) * 1.05, 0.0, 1.0);
    outc = mix(bg, fg, g) * gapMask(loc);
  }

  if (uMix > 0.001) outc = mix(outc, grade(source(frag)), uMix);
  gl_FragColor = vec4(outc, 1.0);
}
</script>

<script>
(() => {
  const FRAG = document.getElementById('frag').textContent;
  const VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';

  const SOURCES = ['プリズム', '青の流れ', '積雲', '夕方の雲', '画像…'];
  const EFFECTS = ['ディザ', 'ドット', '二色刷り', 'モザイク'];
  const PATTERNS = ['規則（Bayer 8×8）', 'ランダム'];
  const SHAPES = ['丸', '線', 'ひし形'];

  const PRESETS = [
    { name: 'プリズムのディザ', s: { source: 0, effect: 0, cell: 3, contrast: 1.25, bright: 0, levels: 3, gap: 1, angle: 45, mix: 0, pattern: 1, shape: 0, ink: '#03060f', paper: '#ffffff', speed: 1 } },
    { name: '青の網点', s: { source: 1, effect: 1, cell: 8, contrast: 1.1, bright: 0.02, levels: 3, gap: 0, angle: 45, mix: 0, pattern: 0, shape: 0, ink: '#03060f', paper: '#ffffff', speed: 1 } },
    { name: '雲の二色刷り', s: { source: 2, effect: 2, cell: 4, contrast: 1.5, bright: -0.1, levels: 3, gap: 0, angle: 45, mix: 0, pattern: 0, shape: 0, ink: '#2a5bf0', paper: '#ffffff', speed: 1 } },
    { name: '夕方の雲モザイク', s: { source: 3, effect: 3, cell: 9, contrast: 1.05, bright: 0, levels: 6, gap: 0, angle: 45, mix: 0.35, pattern: 0, shape: 0, ink: '#03060f', paper: '#ffffff', speed: 1 } },
  ];

  const SLIDERS = [
    { id: 'cell', label: '粒の大きさ', min: 2, max: 28, step: 1, fmt: v => v + ' pt' },
    { id: 'contrast', label: 'コントラスト', min: 0.5, max: 2.2, step: 0.05, fmt: v => v.toFixed(2) },
    { id: 'bright', label: '明るさ', min: -0.4, max: 0.4, step: 0.01, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(2) },
    { id: 'levels', label: '階調の数', min: 2, max: 8, step: 1, fmt: v => v + ' 段', effects: [0, 3] },
    { id: 'gap', label: 'すき間', min: 0, max: 3, step: 0.5, fmt: v => v + ' pt', effects: [0, 3] },
    { id: 'angle', label: '網の角度', min: 0, max: 90, step: 1, fmt: v => v + '°', effects: [2] },
    { id: 'mix', label: '元の絵を残す', min: 0, max: 1, step: 0.05, fmt: v => Math.round(v * 100) + '%' },
    { id: 'speed', label: '動きの速さ', min: 0, max: 3, step: 0.1, fmt: v => v.toFixed(1) + '×' },
  ];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let state = Object.assign({}, PRESETS[0].s, { animate: !reduceMotion, overlay: false });
  try {
    const saved = JSON.parse(localStorage.getItem('dither-backdrop') || 'null');
    if (saved && typeof saved === 'object') Object.assign(state, saved, saved.source === 4 ? { source: 0 } : {});
  } catch (e) {}
  let time = 7.3;
  let image = null;

  const hexToRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; };
  const dpr = () => Math.min(window.devicePixelRatio || 1, 2);

  function createRenderer(canvas, preserve) {
    const gl = canvas.getContext('webgl', { preserveDrawingBuffer: preserve, antialias: false });
    if (!gl) return null;
    const sh = (type, src) => {
      const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
      return s;
    };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, VERT));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FRAG));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const U = {};
    ['uRes', 'uTime', 'uSource', 'uEffect', 'uPattern', 'uShape', 'uTex', 'uTexSize', 'uCell', 'uContrast', 'uBright', 'uGap', 'uLevels', 'uAngle', 'uMix', 'uInk', 'uPaper']
      .forEach(n => U[n] = gl.getUniformLocation(prog, n));
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, 1, 1, 0, gl.RGB, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0]));
    let texSize = [1, 1];
    let texImage = null;

    function syncImage() {
      if (!image || texImage === image) return;
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, image);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      texSize = [image.naturalWidth || image.width, image.naturalHeight || image.height];
      texImage = image;
    }

    function draw(s, w, h, t, scale) {
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      syncImage();
      gl.viewport(0, 0, w, h);
      gl.uniform2f(U.uRes, w, h);
      gl.uniform1f(U.uTime, t);
      gl.uniform1i(U.uSource, s.source === 4 && !image ? 0 : s.source);
      gl.uniform1i(U.uEffect, s.effect);
      gl.uniform1i(U.uPattern, s.pattern);
      gl.uniform1i(U.uShape, s.shape);
      gl.uniform1i(U.uTex, 0);
      gl.uniform2f(U.uTexSize, texSize[0], texSize[1]);
      gl.uniform1f(U.uCell, Math.max(1, s.cell * scale));
      gl.uniform1f(U.uContrast, s.contrast);
      gl.uniform1f(U.uBright, s.bright);
      gl.uniform1f(U.uGap, s.gap * scale);
      gl.uniform1f(U.uLevels, s.levels);
      gl.uniform1f(U.uAngle, s.angle);
      gl.uniform1f(U.uMix, s.mix);
      gl.uniform3fv(U.uInk, hexToRgb(s.ink));
      gl.uniform3fv(U.uPaper, hexToRgb(s.paper));
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    return { draw, canvas };
  }

  const view = document.getElementById('view');
  const stage = document.getElementById('stage');
  let main, off;
  try {
    main = createRenderer(view, false);
    off = createRenderer(document.createElement('canvas'), true);
  } catch (e) { console.error(e); }
  if (!main || !off) {
    const d = document.createElement('div');
    d.className = 'webgl-error';
    d.textContent = 'このブラウザでは WebGL が使えないため、背景を描けません。別のブラウザで開いてください。';
    stage.appendChild(d);
  }

  // ---- 描画 ----
  let needs = true;
  function render() {
    if (!main) return;
    const r = dpr();
    const w = Math.max(1, Math.round(view.clientWidth * r));
    const h = Math.max(1, Math.round(view.clientHeight * r));
    main.draw(state, w, h, time, r);
  }
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (state.animate && state.speed > 0) { time += dt * state.speed; needs = true; }
    if (needs) { render(); needs = false; }
    requestAnimationFrame(loop);
  }
  new ResizeObserver(() => { needs = true; }).observe(view);
  requestAnimationFrame(loop);

  function save() {
    try { localStorage.setItem('dither-backdrop', JSON.stringify(state)); } catch (e) {}
  }

  // ---- 操作 ----
  function seg(el, items, key, onPick) {
    el.innerHTML = '';
    items.forEach((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.id = el.id + '-' + i;
      b.textContent = label;
      b.addEventListener('click', () => onPick ? onPick(i) : set({ [key]: i }));
      el.appendChild(b);
    });
  }
  seg(document.getElementById('segSource'), SOURCES, 'source', i => {
    if (i === 4) { document.getElementById('file').click(); return; }
    set({ source: i });
  });
  seg(document.getElementById('segEffect'), EFFECTS, 'effect');
  seg(document.getElementById('segPattern'), PATTERNS, 'pattern');
  seg(document.getElementById('segShape'), SHAPES, 'shape');

  const sliderBox = document.getElementById('sliders');
  SLIDERS.forEach(sd => {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    if (sd.effects) wrap.dataset.effects = sd.effects.join(',');
    wrap.innerHTML = `<label for="r-${sd.id}">${sd.label}</label><output id="o-${sd.id}"></output>` +
      `<input type="range" id="r-${sd.id}" min="${sd.min}" max="${sd.max}" step="${sd.step}">`;
    sliderBox.appendChild(wrap);
    wrap.querySelector('input').addEventListener('input', e => set({ [sd.id]: parseFloat(e.target.value) }, true));
  });

  const ink = document.getElementById('ink'), paper = document.getElementById('paper');
  ink.addEventListener('input', () => set({ ink: ink.value }, true));
  paper.addEventListener('input', () => set({ paper: paper.value }, true));
  document.getElementById('animate').addEventListener('change', e => set({ animate: e.target.checked }));
  document.getElementById('overlay').addEventListener('change', e => set({ overlay: e.target.checked }));

  // 見本のサムネイル
  const presetBox = document.getElementById('presets');
  PRESETS.forEach((p, i) => {
    const b = document.createElement('button');
    b.className = 'preset';
    b.type = 'button';
    b.id = 'preset-' + i;
    b.innerHTML = `<img alt=""><span>${p.name}</span>`;
    b.addEventListener('click', () => set(Object.assign({}, p.s)));
    presetBox.appendChild(b);
    if (off) {
      off.draw(p.s, 320, 200, 7.3, 1);
      b.querySelector('img').src = off.canvas.toDataURL('image/png');
    }
  });

  function sync(skipInputs) {
    document.querySelectorAll('#segSource button').forEach((b, i) => b.setAttribute('aria-pressed', String(state.source === i)));
    document.querySelectorAll('#segEffect button').forEach((b, i) => b.setAttribute('aria-pressed', String(state.effect === i)));
    document.querySelectorAll('#segPattern button').forEach((b, i) => b.setAttribute('aria-pressed', String(state.pattern === i)));
    document.querySelectorAll('#segShape button').forEach((b, i) => b.setAttribute('aria-pressed', String(state.shape === i)));
    SLIDERS.forEach(sd => {
      const inp = document.getElementById('r-' + sd.id);
      if (!skipInputs) inp.value = state[sd.id];
      document.getElementById('o-' + sd.id).textContent = sd.fmt(state[sd.id]);
    });
    if (!skipInputs) { ink.value = state.ink; paper.value = state.paper; }
    document.getElementById('inkLabel').textContent = state.effect === 2 ? 'インク' : '地の色';
    document.getElementById('animate').checked = state.animate;
    document.getElementById('overlay').checked = state.overlay;
    document.getElementById('mock').hidden = !state.overlay;
    document.querySelectorAll('[data-effects]').forEach(el => {
      el.hidden = !el.dataset.effects.split(',').map(Number).includes(state.effect);
    });
    PRESETS.forEach((p, i) => {
      const same = Object.keys(p.s).every(k => k === 'speed' || state[k] === p.s[k]);
      document.getElementById('preset-' + i).setAttribute('aria-pressed', String(same));
    });
  }
  function set(patch, fromInput) {
    Object.assign(state, patch);
    needs = true;
    sync(fromInput);
    save();
  }
  sync();

  // 見本の UI のマス
  const grid = document.getElementById('mockGrid');
  for (let i = 0; i < 48; i++) {
    const s = document.createElement('span');
    if ([3, 7, 8, 14, 15, 16, 21, 26, 27, 28, 33, 39, 40, 44, 45].includes(i)) s.className = 'on';
    grid.appendChild(s);
  }

  // ---- 画像の取り込み ----
  function loadFile(f) {
    if (!f || !f.type.startsWith('image/')) { toast('画像のファイルを選んでください。'); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => { image = img; set({ source: 4 }); toast(`「${f.name}」を元の絵にしました。`); };
    img.onerror = () => toast('この画像は読み込めませんでした。PNG か JPEG を試してください。');
    img.src = url;
  }
  document.getElementById('file').addEventListener('change', e => loadFile(e.target.files[0]));
  stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('drag'); });
  stage.addEventListener('dragleave', () => stage.classList.remove('drag'));
  stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });
  window.addEventListener('paste', e => {
    const item = [...(e.clipboardData?.items || [])].find(it => it.type.startsWith('image/'));
    if (item) loadFile(item.getAsFile());
  });

  // ---- 書き出し ----
  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.textContent = ''; }, 4000);
  }
  async function copyText(text, done) {
    try { await navigator.clipboard.writeText(text); toast(done); }
    catch (e) { toast('コピーできませんでした。このブラウザではクリップボードが使えません。'); }
  }
  document.getElementById('copyJson').addEventListener('click', () => {
    const { animate, overlay, ...rest } = state;
    copyText(JSON.stringify(Object.assign(rest, { source: SOURCES[state.source], effect: EFFECTS[state.effect], time: +time.toFixed(2) }), null, 2), '設定をコピーしました。');
  });
  document.getElementById('copyShader').addEventListener('click', () => copyText(FRAG.trim(), 'フラグメントシェーダー（GLSL）をコピーしました。'));

  const modal = document.getElementById('modal');
  const modalImg = document.getElementById('modalImg');
  function renderExport() {
    const v = document.getElementById('size').value;
    let w, h;
    if (v === 'view') { w = view.width; h = view.height; }
    else [w, h] = v.split('x').map(Number);
    off.draw(state, w, h, time, dpr());
    return { w, h };
  }
  // 保存：claude.ai の中では downloads を使う（ページから直接のダウンロードは止められているため）。
  // それ以外のブラウザでは、普通のダウンロードのリンクで保存する。
  const inClaude = !!(window.claude && typeof window.claude.use === 'function');
  let downloads = null;
  const saveBtn = document.getElementById('saveImg');
  const modalToast = document.getElementById('modalToast');
  const mtoast = msg => { modalToast.textContent = msg; };
  saveBtn.hidden = inClaude;
  if (inClaude) {
    window.claude.use('downloads').then(d => { downloads = d; saveBtn.hidden = !d; }).catch(() => {});
  }
  let exportBlob = null, exportName = 'backdrop.png';
  document.getElementById('export').addEventListener('click', () => {
    if (!off) return;
    const { w, h } = renderExport();
    const url = off.canvas.toDataURL('image/png');
    modalImg.src = url;
    // data: URL の fetch はページの CSP で止められるので、canvas から直接 Blob を作る
    exportBlob = new Promise((resolve, reject) => off.canvas.toBlob(b => b ? resolve(b) : reject(new Error('toBlob failed')), 'image/png'));
    exportBlob.catch(() => {});
    exportName = `backdrop-${['prism', 'sweep', 'cumulus', 'dusk', 'image'][state.source]}-${['dither', 'dots', 'duotone', 'mosaic'][state.effect]}-${w}x${h}.png`;
    document.getElementById('modalTitle').textContent = `書き出した画像（${w} × ${h}）`;
    document.getElementById('modalNote').textContent = !inClaude
      ? '粒の細かさは、いまの画面と同じ倍率です。'
      : downloads
        ? '「PNG を保存」を押すと、保存の確認が出ます。粒の細かさは、いまの画面と同じ倍率です。'
        : 'このページでは保存のボタンが使えません。「画像をコピー」でコピーして、ほかのアプリに貼ってください。';
    mtoast('');
    modal.hidden = false;
  });
  saveBtn.addEventListener('click', async () => {
    if (!exportBlob) return;
    if (!inClaude) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(await exportBlob);
      a.download = exportName;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      mtoast('保存しました。');
      return;
    }
    if (!downloads) return;
    try {
      await downloads.save({ filename: exportName, data: await exportBlob });
      mtoast('保存しました。');
    } catch (e) {
      const code = e && e.code;
      if (code === 'declined') mtoast('保存をやめました。');
      else if (code === 'rate_limited') mtoast('保存の確認がすでに開いています。そちらを閉じてから押してください。');
      else mtoast(`保存できませんでした（${code || (e && e.message) || '原因不明'}）。`);
    }
  });
  document.getElementById('copyImg').addEventListener('click', async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': exportBlob })]);
      mtoast('画像をコピーしました。');
    } catch (e) {
      mtoast(`画像をコピーできませんでした（${(e && (e.name || e.message)) || '原因不明'}）。`);
    }
  });
  document.getElementById('closeModal').addEventListener('click', () => { modal.hidden = true; });
  modal.addEventListener('click', e => { if (e.target === modal) modal.hidden = true; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') modal.hidden = true; });
})();
</script>
</body>
</html>
